  <!-- Header -->
  <text x="300" y="52" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#2E0F15" text-anchor="middle">★ DOUBLE POLAROID EDITORIAL ★</text>

  <!-- Slot 0: x=60, y=80, w=480, h=330 -->
  <rect x="56" y="76" width="488" height="338" fill="#FDFBF7" stroke="#2E0F15" stroke-width="2" />
  <rect x="60" y="80" width="480" height="330" fill="none" stroke="#2E0F15" stroke-width="1.5" />

  <!-- Slot 1: x=60, y=450, w=480, h=330 -->
