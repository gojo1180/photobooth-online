<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1400" width="480" height="1400">
  <defs>
    <!-- Filter for drop shadow on stickers -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#2E0F15" />
    </filter>
  </defs>

  <!-- Frame Background (Powder Pink with 1.5px border) -->
  <rect x="0" y="0" width="480" height="1400" fill="#F7A8B8" />
  <rect x="0" y="0" width="480" height="1400" fill="none" stroke="#2E0F15" stroke-width="3" />

  <!-- Inner editorial header banner -->
  <rect x="30" y="24" width="420" height="42" rx="21" fill="#FEF08A" stroke="#2E0F15" stroke-width="1.5" />
  <text x="240" y="50" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#2E0F15" text-anchor="middle">★ VIRTUAL PHOTOBOOTH ★</text>

  <!-- 3 Cutout Slots (Transparent holes: x=40, y=90, w=400, h=360), (x=40, y=480, w=400, h=360), (x=40, y=870, w=400, h=360) -->
  <!-- Note: We draw slot borders with hard offset look -->
  <rect x="40" y="90" width="400" height="360" fill="none" stroke="#2E0F15" stroke-width="2" />
  <rect x="40" y="480" width="400" height="360" fill="none" stroke="#2E0F15" stroke-width="2" />
  <rect x="40" y="870" width="400" height="360" fill="none" stroke="#2E0F15" stroke-width="2" />

  <!-- Faux Masking Tape Top -->
  <rect x="180" y="78" width="120" height="24" fill="rgba(255,255,255,0.75)" stroke="rgba(46,15,21,0.2)" stroke-width="1" transform="rotate(-1 240 90)" />

  <!-- Faux Masking Tape Middle -->
  <rect x="25" y="470" width="70" height="20" fill="rgba(255,255,255,0.7)" transform="rotate(-15 60 480)" />

  <!-- Y2K Decorative Ephemera & Stickers -->
  <!-- Acid Lime Sparkle Pill -->
  <g transform="translate(360, 465)" filter="url(#stickerShadow)">
    <rect width="90" height="28" rx="14" fill="#D2F17C" stroke="#2E0F15" stroke-width="1.5" />
    <text x="45" y="18" font-family="'DM Sans', sans-serif" font-size="10" font-weight="900" fill="#2E0F15" text-anchor="middle">IT GIRL ✦</text>
  </g>

  <!-- Baby Blue Heart Badge -->
  <g transform="translate(30, 855)" filter="url(#stickerShadow)">
    <circle cx="20" cy="20" r="20" fill="#BEE3F8" stroke="#2E0F15" stroke-width="1.5" />
    <text x="20" y="25" font-size="16" text-anchor="middle">♡</text>
  </g>

  <!-- Footer Section with Editorial Typography -->
  <rect x="30" y="1255" width="420" height="115" rx="8" fill="#FDFBF7" stroke="#2E0F15" stroke-width="1.5" />
  <text x="240" y="1295" font-family="'Playfair Display', serif" font-style="italic" font-size="22" fill="#2E0F15" text-anchor="middle">Memories forever</text>
  <line x1="60" y1="1312" x2="420" y2="1312" stroke="#2E0F15" stroke-width="1" stroke-dasharray="4 4" />
  <text x="240" y="1335" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#827375" text-anchor="middle">Y2K SCRAPBOOK EDITORIAL • STUDIO EDITION</text>
  <text x="240" y="1352" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#2E0F15" text-anchor="middle">09 . 13 . 2026</text>
</svg>
